<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#21030b">
    <title>I miss you</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="heart-rain" aria-hidden="true"></div>
    <div class="ambient-decor" aria-hidden="true">
        <span class="ornament ornament-one">&#10022;</span>
        <span class="ornament ornament-two">&#9825;</span>
        <span class="ornament ornament-three">&#10023;</span>
        <span class="ornament ornament-four">&#9829;</span>
        <span class="ornament ornament-five">&#10022;</span>
        <span class="ornament ornament-six">&#9825;</span>
        <span class="ornament ornament-seven">&#10047;</span>
        <span class="ornament ornament-eight">&#10022;</span>
        <span class="ornament ornament-nine">&#9825;</span>
        <span class="ornament ornament-ten">&#10024;</span>
        <span class="ornament ornament-eleven">&#10047;</span>
        <span class="ornament ornament-twelve">&#9829;</span>
    </div>
    <main class="card">
        <p class="eyebrow">I have something to ask :> </p>
        <section class="envelope" aria-label="A glowing love letter">
            <div class="letter" id="love-letter" inert>
                <h1>Oi, i miss you</h1>
                <div class="hearts" aria-label="I love you">&#9829; <span></span> &#9829;</div>
                <p class="question">namimiss mo po ba ako? </p>
                <div class="buttons" aria-label="Choose your answer">
                    <button class="yes-button" type="button">Yes</button>
                    <button class="no-button" type="button">No</button>
                </div>
                <button class="close-button" type="button">Close</button>
            </div>
            <div class="envelope-back" aria-hidden="true"></div>
            <div class="envelope-front" aria-hidden="true"></div>
            <div class="envelope-flap" aria-hidden="true"></div>
            <div class="seal" aria-hidden="true">&#9829;</div>
            <p class="open-prompt">Open to see what's inside po</p>
            <button class="open-button" type="button" aria-controls="love-letter" aria-expanded="false">Click me :></button>
        </section>
        <p class="response" aria-live="polite"></p>
    </main>
</body>
</html>
